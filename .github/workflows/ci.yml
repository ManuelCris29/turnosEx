name: CI

# Integración continua de SWALP/AppTurnos.
# Corre en cada push y PR a main: valida configuración de Django y ejecuta
# la suite de tests (pytest) contra un MySQL real, igual que en local.

# Corre en CUALQUIER rama, no solo en main. Un CI que solo se entera al abrir el
# PR no sirve de red de seguridad mientras se refactoriza: el objetivo es saber
# que algo se rompió en el push que lo rompió, no tres días después.
on:
  push:
    branches: [ '**' ]
  pull_request:

# Dos pushes seguidos a la misma rama: cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + Django check
    runs-on: ubuntu-latest

    # El proyecto Django vive en AppTurnosExplora/ (el repo tiene esa subcarpeta).
    defaults:
      run:
        working-directory: AppTurnosExplora

    # Base de datos MySQL efímera para los tests (Django crea test_<DB_NAME>).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bdturnosex
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Variables que settings.py lee del entorno (sin .env en CI).
    # Solo valores de prueba: NO son secretos de producción.
    env:
      ENVIRONMENT: development          # sin HTTPS/HSTS en el runner
      DEBUG: "False"
      SECRET_KEY: ci-secret-key-solo-para-tests-no-produccion-0123456789
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_NAME: bdturnosex
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci
      DEFAULT_FROM_EMAIL: SWALP <no-reply@example.com>

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"       # debe coincidir con el Python de producción
          cache: pip
          cache-dependency-path: AppTurnosExplora/requirements-dev.txt

      # MySQL no trae las tablas de zona horaria pobladas; con USE_TZ=True y
      # America/Bogota, las consultas con fechas usan CONVERT_TZ y fallarían.
      # Se cargan en el contenedor de MySQL desde el runner.
      - name: Cargar zonas horarias en MySQL
        run: mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -h 127.0.0.1 -P 3306 -u root -proot mysql

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # incluye prod (-r requirements.txt) + pytest

      - name: Django system check
        run: python manage.py check

      # Valida la FORMA de la configuración de producción, no la de CI: HSTS,
      # cookies seguras y la caché compartida (core.E001). Sin este paso, un
      # despliegue con LocMemCache y varios workers de Gunicorn pasaría el CI
      # sin ruido y serviría Mis Turnos desactualizado en producción.
      # Los valores son ficticios; el único propósito es que las comprobaciones
      # de --deploy se ejecuten en modo producción.
      - name: Django check --deploy (configuración de producción)
        env:
          ENVIRONMENT: production
          DEBUG: "False"
          SECRET_KEY: ci-deploy-check-clave-larga-y-unica-no-produccion-0123456789
          ALLOWED_HOSTS: ejemplo.com
          CSRF_TRUSTED_ORIGINS: https://ejemplo.com
          CACHE_URL: redis://localhost:6379/1   # no se conecta: solo se valida el backend
        run: python manage.py check --deploy

      # -n auto reparte la suite entre los núcleos del runner (pytest-django da a
      # cada worker su propia base test_*_gwN, así que no se pisan).
      # El gate de cobertura arranca en 64: el baseline medido es 65,19 %, y se
      # sube 5 puntos por fase de refactor. Sin `.`, respeta los testpaths de
      # pytest.ini y no recoge los test_*.py sueltos de scripts/.
      - name: Ejecutar tests (pytest)
        run: pytest -n auto --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=64

      - name: Publicar coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: AppTurnosExplora/coverage.xml
          if-no-files-found: warn

  lint:
    name: Lint (bloqueante)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppTurnosExplora
    # BLOQUEANTE desde el 2026-08-19: el baseline de las reglas activas
    # (select = ["F", "E9"]) quedó en CERO al limpiar los 470 imports sin usar.
    # A partir de aquí no se trata de saldar deuda vieja sino de no crear nueva,
    # y para eso el job tiene que frenar. Al ampliar el `select` en
    # pyproject.toml, limpiar la familia ANTES de añadirla.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: ruff
        run: ruff check .

  seguridad:
    name: Seguridad (informativo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppTurnosExplora
    # Separado de `lint` y NO bloqueante a propósito: pip-audit depende del
    # boletín de CVE publicado, así que una vulnerabilidad nueva en una
    # dependencia dejaría de golpe todos los merges bloqueados por algo que no
    # ha cambiado en el código. Se quiere el aviso, no el freno.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: pip install bandit pip-audit

      - name: bandit
        run: bandit -c pyproject.toml -r . -ll

      - name: pip-audit
        run: pip-audit -r requirements.txt
