# Prueba LOCAL de la app dockerizada (imagen de PRODUCCIÓN, navegable en HTTP).
# No toca tu MySQL local ni tus datos: levanta su propia base efímera.
#
#   docker compose -f docker-compose.local.yml up --build -d
#   # (primera vez) cargar zonas horarias y crear admin — ver README de deployment
#   Abrir:  http://localhost:8000
#   Apagar: docker compose -f docker-compose.local.yml down -v
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: localpw
      MYSQL_DATABASE: bdturnosex
    ports:
      # 127.0.0.1 delante NO es decorativo. Sin él, Docker publica el puerto en
      # 0.0.0.0, así que este MySQL —con la contraseña `localpw`, que está en este
      # mismo fichero versionado— queda accesible desde CUALQUIER equipo de la red:
      # el wifi de la oficina, el de una cafetería, el de un hotel. Con el prefijo
      # solo escucha en la máquina que lo levanta, que es lo único que hace falta.
      #
      # El 3307 es para no chocar con el MySQL local del host (3306).
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocalpw"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production          # imagen de prod (sin debug-toolbar)
      DEBUG: "False"
      SECURE_HTTPS: "False"            # permite navegar en HTTP local (sin redirección a https)
      SECRET_KEY: local-test-key-no-produccion
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:8000
      SITE_URL: http://localhost:8000
      DB_NAME: bdturnosex
      DB_USER: root
      DB_PASSWORD: localpw
      DB_HOST: db
      DB_PORT: "3306"
      EMAIL_SEND_ASYNC: "False"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST_USER: local@test.local
      EMAIL_HOST_PASSWORD: x
      DEFAULT_FROM_EMAIL: SWALP <no-reply@test.local>
    ports:
      - "8000:8000"
