# Configuración de análisis SonarQube para SWALP.
# Objetivo: analizar SOLO el código de producción; excluir terceros y generado.
sonar.projectKey=SWALP
sonar.sources=.

# Codificación del código fuente y versión de Python del entorno (venvturnos).
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Cobertura: generado por `pytest --cov=. --cov-report=xml` (ver manual SonarQube).
sonar.python.coverage.reportPaths=coverage.xml

# Exclusiones (mismo criterio que .semgrepignore):
# - static/plugins: librerías de terceros (moment, codemirror, jquery…), ~25k issues de ruido.
# - staticfiles: recolección de estáticos (generado por collectstatic).
# - migrations: código autogenerado por Django.
# - scripts: herramientas de dev/mantenimiento que ejecuta un admin manualmente,
#   NO se despliegan (aquí viven los 8 S2077 de SQL con tablas hardcodeadas = falsos positivos).
#   Para analizarlas puntualmente, quítalas de esta línea.
sonar.exclusions=**/static/plugins/**,**/static/lib/**,**/static/css/alt/**,**/*.min.css,**/*.min.js,**/staticfiles/**,**/migrations/**,**/venvturnos/**,scripts/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.ico,**/*.docx,**/*.pdf,**/*.mwb,**/*.mwb.bak

# Los tests no cuentan para métricas de código de producción.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py

# Falsos positivos suprimidos (documentados):
# - Web:S5247 en change_password.html: el `|safe` aplica al help_text de reglas
#   de contraseña generado por Django (SetPasswordForm), es HTML del framework,
#   NO input de usuario. Quitar |safe mostraría las etiquetas <ul><li> como texto.
#
# Decisiones de triaje (justificación completa en docs/05-referencia/sonarqube-triage.md):
#
# e2-e6  S1135 "TODO": falso positivo por IDIOMA. Los comentarios empiezan con la
#        palabra española "Todo" ("Todo en una transacción…", "Todo es de solo
#        lectura…"), no con el marcador inglés TODO. No hay tarea pendiente.
#        Se suprime archivo por archivo (no la regla entera) para no perder la
#        detección de TODO reales en el resto del proyecto.
# e7-e9  S8572 logging.exception(): el código ya usa
#        `logger.error(..., exc_info=True)`, que es EXACTAMENTE equivalente
#        (logging.exception es azúcar sintáctico de eso). Cambio de valor nulo.
# e10    S6470 `COPY . .` en Dockerfile: Sonar no lee .dockerignore, y el nuestro
#        ya excluye .env, .git/, venvturnos/ y db.sqlite3. Enumerar ~20 COPY
#        explícitos sería más frágil (habría que recordar cada archivo nuevo).
# e11    S2486 catch en pdh_create.js: la excepción SÍ se maneja, cayendo a un
#        valor por defecto seguro si el JSON viene corrupto. No es un catch vacío.
# e12    S1192 en settings.py: los literales repetidos son "'unsafe-inline'" y
#        "data:" de la política CSP. Extraerlos a constantes EMPEORA la lectura:
#        la política se entiende mejor tal como se emite en la cabecera HTTP.
#        OJO: solo se suprime en settings.py. Los otros S1192 del proyecto
#        (p. ej. 'D FDS', repetido en 28 archivos sin constante central) son
#        deuda legítima y siguen reportándose a propósito.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S5247
