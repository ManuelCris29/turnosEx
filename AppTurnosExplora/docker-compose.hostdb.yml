# Prueba LOCAL de la app dockerizada contra tu MySQL REAL (host).
# Solo levanta el contenedor web; usa la base bdturnosex de tu MySQL local.
# NO corre migraciones (command sobrescrito) para no modificar tu base real.
#
# Requisito (una sola vez): un usuario MySQL que acepte conexión desde el
# contenedor, p. ej.:
#   CREATE USER 'swalp'@'%' IDENTIFIED BY 'swalp_docker_2026';
#   GRANT ALL PRIVILEGES ON bdturnosex.* TO 'swalp'@'%'; FLUSH PRIVILEGES;
#
#   docker compose -f docker-compose.hostdb.yml up --build -d
#   Abrir:  http://localhost:8000
#   Apagar: docker compose -f docker-compose.hostdb.yml down
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # host.docker.internal = tu máquina (host) desde dentro del contenedor.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Sin migrate: solo Gunicorn (no toca el esquema de tu base real).
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
              "--workers", "3", "--timeout", "60",
              "--access-logfile", "-", "--error-logfile", "-"]
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECURE_HTTPS: "False"            # navegable en HTTP local
      SECRET_KEY: local-test-key-no-produccion
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:8000
      SITE_URL: http://localhost:8000
      DB_NAME: bdturnosex
      DB_USER: swalp
      DB_PASSWORD: swalp_docker_2026
      DB_HOST: host.docker.internal     # tu MySQL local
      DB_PORT: "3306"
      EMAIL_SEND_ASYNC: "False"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST_USER: local@test.local
      EMAIL_HOST_PASSWORD: x
      DEFAULT_FROM_EMAIL: SWALP <no-reply@test.local>
    ports:
      - "8000:8000"
