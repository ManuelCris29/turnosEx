# Prueba LOCAL de la app dockerizada contra tu MySQL REAL (host).
# Solo levanta el contenedor web; usa la base bdturnosex de tu MySQL local.
# NO corre migraciones (command sobrescrito) para no modificar tu base real.
#
# Requisito (una sola vez): un usuario MySQL que acepte la conexión del contenedor.
#
#   CREATE USER 'swalp'@'172.%' IDENTIFIED BY 'LA-QUE-PONGAS-EN-.env';
#   GRANT ALL PRIVILEGES ON bdturnosex.* TO 'swalp'@'172.%'; FLUSH PRIVILEGES;
#
# DOS CAMBIOS respecto a lo que decía antes, y los dos importan:
#
#   1. El host es `172.%` (el rango del puente de Docker) y ya no `%`. Con `%` ese
#      usuario podía conectarse desde CUALQUIER máquina, y como la contraseña
#      estaba escrita aquí abajo —en un fichero versionado—, cualquiera con acceso
#      a la red y al MySQL del equipo entraba con ALL PRIVILEGES sobre la base.
#      Comprueba tu rango con `docker network inspect bridge` si no conecta.
#
#   2. La contraseña ya no se escribe aquí: sale de `DB_PASSWORD` en tu `.env`
#      (que está en .gitignore y que ya usas para `runserver`). Compose lo lee solo.
#
# NOTA: la contraseña anterior (`swalp_docker_2026`) queda en el historial de git y
# reescribirlo no compensa para un repo privado con credenciales locales. Lo que sí
# hay que hacer es NO reutilizarla: al crear el usuario, pon una nueva.
#
#   docker compose -f docker-compose.hostdb.yml up --build -d
#   Abrir:  http://localhost:8000
#   Apagar: docker compose -f docker-compose.hostdb.yml down
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # host.docker.internal = tu máquina (host) desde dentro del contenedor.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Sin migrate: solo Gunicorn (no toca el esquema de tu base real).
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
              "--workers", "3", "--timeout", "60",
              "--access-logfile", "-", "--error-logfile", "-"]
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECURE_HTTPS: "False"            # navegable en HTTP local
      SECRET_KEY: local-test-key-no-produccion
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:8000
      SITE_URL: http://localhost:8000
      DB_NAME: bdturnosex
      DB_USER: swalp
      # Sale de tu `.env` (gitignored). Sin definir, compose aborta con el mensaje
      # de abajo en vez de arrancar con una contraseña vacía y fallar más adelante
      # con un error de conexión que no dice por qué.
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en tu .env}
      DB_HOST: host.docker.internal     # tu MySQL local
      DB_PORT: "3306"
      EMAIL_SEND_ASYNC: "False"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST_USER: local@test.local
      EMAIL_HOST_PASSWORD: x
      DEFAULT_FROM_EMAIL: SWALP <no-reply@test.local>
    ports:
      - "8000:8000"
