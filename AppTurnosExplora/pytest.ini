[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings

# `--disable-warnings` de arriba solo oculta el RESUMEN al final de la corrida; los
# avisos se siguen capturando. El problema es que así nadie los ve: el
# RemovedInDjango60Warning de `CheckConstraint.check` llevaba tiempo emitiéndose y
# pasó desapercibido hasta la auditoría de 2026-08. La documentación de Django es
# explícita en resolver las deprecaciones ANTES de actualizar de versión mayor.
#
# Por eso los avisos de deprecación de Django se convierten en ERROR: si aparece uno
# nuevo, la suite falla y hay que atenderlo, en vez de acumularse hasta que la
# actualización a Django 6.x se vuelva un muro. Lo deprecado en 5.2 (LTS) se ELIMINA
# en Django 6.1.
#
# Para ver todos los avisos de una corrida, sin filtros:  pytest -o addopts=""
filterwarnings =
    error::django.utils.deprecation.RemovedInDjango60Warning
    error::django.utils.deprecation.RemovedInDjango61Warning

testpaths =
    integration_tests
    core/tests
    solicitudes/tests
    turnos/tests
    empleados/tests
    permisos/tests


