[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
testpaths =
    integration_tests
    core/tests
    solicitudes/tests
    turnos/tests
    empleados/tests
    permisos/tests


