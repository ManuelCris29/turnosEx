[tool.bandit]
# Excluye código no productivo del análisis de seguridad.
# Los tests usan contraseñas de prueba ('test123', 'x') que Bandit marca
# como B106 (hardcoded_password); son falsos positivos, no secretos reales.
exclude_dirs = [
    "tests",
    "integration_tests",
    "venvturnos",
    "staticfiles",
    "migrations",
]

# Uso: bandit -c pyproject.toml -r .

# ---------------------------------------------------------------------------
# ruff — linter y formateador.
#
# Arranque deliberadamente conservador: solo errores REALES (F = pyflakes,
# E9 = errores de sintaxis/IO). El baseline completo del proyecto ronda los
# 1.000-1.500 avisos, dominado por E501 (líneas largas, ~637) y F401 (imports
# sin usar, ~437). Activar todo de golpe produce ruido que nadie lee.
#
# El plan es endurecerlo por familias, limpiando una y añadiéndola al `select`.
# Uso: ruff check .            (revisar)
#      ruff check . --fix      (arreglar lo autocorregible — revisar el diff)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "*/migrations/*",
    "scripts/",
    "staticfiles/",
    "venvturnos/",
]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# En un __init__.py un import "sin usar" suele ser un re-export deliberado: el
# paquete lo expone para que otros hagan `from paquete import X`. Borrarlo
# rompe a los consumidores sin que falle nada en el propio archivo.
#
# F403/F405 (`from .x import *`) por el mismo motivo: solicitudes/views/__init__.py
# y turnos/views/__init__.py son agregadores GENERADOS por
# solicitudes/tools/split_views.py, que reúnen las vistas repartidas en varios
# módulos bajo un solo espacio de nombres. El `import *` ahí es el patrón elegido,
# no un descuido; ya venía marcado con `# noqa: F401,F403` en cada línea.
"**/__init__.py" = ["F401", "F403", "F405"]
